<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#5B6CFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Talk Buddy">
<meta name="description" content="Talk Buddy - AI destekli konusma arkadasi. Uygulama on izlemesi.">
<title>Talk Buddy — Ön İzleme (Beta 0.9.0)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23EEF0FF'/><circle cx='32' cy='32' r='21' fill='%235B6CFF'/><circle cx='25' cy='28' r='4' fill='%23fff'/><circle cx='39' cy='28' r='4' fill='%23fff'/><path d='M24 40q8 7 16 0' stroke='%2313172B' stroke-width='3' fill='none' stroke-linecap='round'/></svg>">
<style>
:root{
  --brand:#5B6CFF; --brand-dark:#3B49C4; --brand-soft:#EEF0FF;
  --coral:#FF7A6B; --mint:#2ED3A5; --lemon:#FFC53D; --sky:#41C9FF; --grape:#A678FF;
  --ink:#13172B; --ink-soft:#5A6079; --line:#E6E8F0; --canvas:#F7F8FC;
  --success:#22C55E; --warning:#F59E0B; --danger:#EF4444; --info:#3B82F6;
  --r-sm:10px; --r-md:16px; --r-lg:24px; --r-xl:32px; --r-pill:999px;
  --nav-h:62px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  color:var(--ink); background:#0E1020; overflow:hidden;
}

/* ================= MASAÜSTÜ KABUĞU ================= */
#desk{height:100%;display:flex;flex-direction:column;align-items:center;
  padding:22px 16px 30px;overflow-y:auto}
.hero{text-align:center;color:#fff;max-width:720px;margin-bottom:20px}
.hero h1{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:7px}
.hero h1 b{background:linear-gradient(90deg,#8B9AFF,#41C9FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#9BA3C7;font-size:13.5px;line-height:1.6}
.chips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.chip{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
  color:#C9CFEA;font-size:11.5px;padding:5px 10px;border-radius:var(--r-pill)}

.stage{display:flex;gap:26px;align-items:flex-start;max-width:1120px;width:100%;justify-content:center}
.nav{width:200px;flex-shrink:0}
.nav-title{color:#6C74A0;font-size:10px;font-weight:800;letter-spacing:1.1px;
  text-transform:uppercase;margin:14px 0 7px 10px}
.nav-title:first-child{margin-top:0}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:transparent;border:1px solid transparent;color:#A8B0D4;font-size:13px;
  font-family:inherit;padding:9px 11px;border-radius:11px;cursor:pointer;
  transition:.15s;margin-bottom:2px}
.nav button:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button.on{background:var(--brand);color:#fff;border-color:#7C89FF;font-weight:600}
.nav .ico{width:18px;text-align:center;font-size:14px}

.device{width:392px;height:812px;background:#000;border-radius:46px;padding:11px;
  box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 0 2px #24273D;position:relative;flex-shrink:0}
.device::after{content:'';position:absolute;top:23px;left:50%;transform:translateX(-50%);
  width:104px;height:26px;background:#000;border-radius:var(--r-pill);z-index:60;pointer-events:none}
.device #app{border-radius:36px}
.caption{color:#8B93BC;font-size:12px;text-align:center;max-width:392px;
  line-height:1.55;margin-top:12px}
.notes{width:236px;flex-shrink:0}
.note{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:13px;padding:13px;margin-bottom:9px}
.note h4{color:#fff;font-size:12px;font-weight:700;margin-bottom:5px}
.note p{color:#98A0C6;font-size:11.5px;line-height:1.6}

/* ================= UYGULAMA YÜZEYİ ================= */
#app{
  width:100%;height:100%;background:var(--canvas);overflow:hidden;position:relative;
  display:flex;flex-direction:column;
}
#view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;position:relative}
#view::-webkit-scrollbar{display:none}

/* Mobil: cihaz çerçevesi yok, tam ekran */
body.mobile #desk{display:none}
body.mobile #phone-host{position:fixed;inset:0;padding:0;border-radius:0;box-shadow:none;background:var(--canvas)}
body.mobile #phone-host::after{display:none}
body.mobile #app{border-radius:0}
#phone-host{display:block}

/* ================= ORTAK ================= */
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.center{justify-content:center}
.grow{flex:1}
.pad{padding:18px 16px 20px}
.pad-c{padding:14px 18px 20px}
.sub{color:var(--ink-soft);font-size:12.5px}
.h2{font-size:17px;font-weight:800}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.soft{background:#fff;border:none;border-radius:var(--r-lg);box-shadow:0 4px 12px rgba(15,21,51,.05)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
  padding:4px 9px;border-radius:var(--r-pill);white-space:nowrap}
.bar{height:8px;background:var(--line);border-radius:var(--r-pill);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:var(--r-pill);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}

.appbar{position:sticky;top:0;z-index:30;background:var(--canvas);
  padding:calc(var(--safe-top) + 12px) 16px 10px;display:flex;align-items:center;gap:9px}
.appbar h2{font-size:17px;font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibtn{width:38px;height:38px;min-width:38px;border-radius:var(--r-pill);border:none;
  background:transparent;display:grid;place-items:center;cursor:pointer;font-size:16px;
  color:var(--ink-soft)}
.ibtn:active{background:#E9EBF5}

/* Alt navigasyon */
#nav{height:calc(var(--nav-h) + var(--safe-bot));background:#fff;
  border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-bot);flex-shrink:0}
#nav.hide{display:none}
#nav button{flex:1;background:none;border:none;font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink-soft);position:relative;padding:0}
#nav button.on{color:var(--brand)}
#nav .ni{font-size:20px;line-height:1;transition:transform .18s}
#nav button.on .ni{transform:scale(1.1)}
#nav .nl{font-size:10.5px;font-weight:600}
#nav button.on .nl{font-weight:800}
#nav .dot{position:absolute;top:8px;left:50%;margin-left:6px;background:var(--danger);
  color:#fff;font-size:9px;font-weight:800;min-width:15px;height:15px;border-radius:8px;
  display:grid;place-items:center;padding:0 4px}

/* Buddy */
.buddy{position:relative;display:grid;place-items:center;margin:0 auto}
.face{border-radius:50%;display:grid;place-items:center;position:relative;
  animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.ring{position:absolute;border-radius:50%;border:3px solid;animation:ripple 1.6s ease-out infinite}
@keyframes ripple{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.6);opacity:0}}
.eye{background:#fff;border-radius:50%;display:grid;place-items:center;animation:blink 4.4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.pupil{background:var(--ink);border-radius:50%;position:relative}
.pupil::after{content:'';position:absolute;top:14%;left:14%;width:36%;height:36%;background:#fff;border-radius:50%}
.m-smile{border-bottom:5px solid var(--ink);border-radius:0 0 60px 60px}
.m-o{background:var(--ink);border-radius:50%}
.m-talk{background:var(--ink);border-radius:9px;animation:talk .34s ease-in-out infinite alternate}
@keyframes talk{from{height:8px}to{height:24px}}
.cheek{position:absolute;background:rgba(255,122,107,.35);border-radius:50%}

.wave{display:flex;align-items:center;justify-content:center;gap:5px;height:50px}
.wave i{width:6px;border-radius:3px;display:block;animation:w .85s ease-in-out infinite alternate}
@keyframes w{from{height:8px}to{height:var(--h)}}

.bigbtn{width:100%;height:70px;background:var(--brand);border:none;border-radius:var(--r-xl);
  color:#fff;font-size:22px;font-weight:800;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  animation:pulse 1.8s ease-in-out infinite;box-shadow:0 12px 28px rgba(91,108,255,.32)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.022)}}
.pill{height:40px;background:#fff;border-radius:var(--r-pill);display:inline-flex;
  align-items:center;gap:5px;padding:0 12px;box-shadow:0 4px 12px rgba(15,21,51,.06);
  font-weight:800;font-size:15px;border:none;font-family:inherit;cursor:pointer;color:var(--ink)}

.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;
  margin:0 -16px;padding-left:16px;padding-right:16px}
.hscroll::-webkit-scrollbar{display:none}
.act{min-width:138px;background:#fff;border-radius:var(--r-lg);padding:13px;
  box-shadow:0 4px 12px rgba(15,21,51,.05);cursor:pointer;height:148px;
  display:flex;flex-direction:column;border:none;font-family:inherit;text-align:left}
.act:active{transform:scale(.97)}
.act .em{width:48px;height:48px;border-radius:var(--r-md);display:grid;place-items:center;font-size:25px}
.act .t{font-size:15px;font-weight:800;line-height:1.15;margin-top:auto;color:var(--ink)}

.bubble{background:#fff;border-radius:var(--r-xl);padding:18px;
  box-shadow:0 8px 24px rgba(15,21,51,.08);min-height:92px}
.bubble.me{background:rgba(91,108,255,.1);border:2px solid rgba(91,108,255,.4);box-shadow:none}
.bubble .who{font-size:12px;font-weight:800;letter-spacing:.7px;color:var(--ink-soft);margin-bottom:6px}
.bubble .tx{font-size:18px;line-height:1.35;font-weight:600}

.badge-tile{background:#fff;border-radius:var(--r-lg);padding:13px;
  box-shadow:0 4px 12px rgba(15,21,51,.05);min-height:104px;display:flex;flex-direction:column}
.badge-tile.lock{opacity:.45;box-shadow:none;border:2px solid var(--line)}

.crow{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;
  margin-bottom:10px;cursor:pointer;transition:.15s;display:block;width:100%;
  font-family:inherit;text-align:left}
.crow:active{transform:scale(.99)}
.crow.risk{border-color:rgba(239,68,68,.35)}
.avat{width:44px;height:44px;background:var(--canvas);border-radius:var(--r-md);
  display:grid;place-items:center;font-size:22px;flex-shrink:0}
.alert{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:13px;
  display:flex;gap:11px;margin-bottom:10px}
.alert .ai{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;
  font-size:15px;flex-shrink:0}

.turn{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
.turn .lbl{width:44px;font-size:10px;font-weight:800;flex-shrink:0;padding-top:8px}
.turn .bd{flex:1;padding:8px 11px;border-radius:var(--r-sm);font-size:12.5px;line-height:1.4}
.ph{aspect-ratio:1;border-radius:var(--r-sm);display:grid;place-items:center;
  font-size:13px;font-weight:800}

.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--canvas);
  position:sticky;top:0;z-index:20}
.tabs button{flex:1;background:none;border:none;font-family:inherit;font-size:13.5px;
  font-weight:700;padding:12px 4px;cursor:pointer;color:var(--ink-soft);
  border-bottom:2px solid transparent}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}

/* Ayarlar */
.sgroup{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.stile{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;
  border:none;background:none;width:100%;font-family:inherit;text-align:left}
.stile:active{background:#F5F6FB}
.stile+.stile{border-top:1px solid var(--line)}
.sicon{width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;
  font-size:16px;flex-shrink:0}
.stitle{font-size:14.5px;font-weight:700;color:var(--ink)}
.ssub{font-size:12.5px;color:var(--ink-soft);line-height:1.35;margin-top:2px}
.slabel{font-size:11.5px;font-weight:800;letter-spacing:.9px;color:var(--ink-soft);
  text-transform:uppercase;margin:0 0 9px 6px}
.sw{width:46px;height:27px;border-radius:14px;background:var(--line);position:relative;
  flex-shrink:0;transition:.2s;cursor:pointer;border:none}
.sw.on{background:var(--brand)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;
  background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on::after{left:22px}
.inp{width:100%;padding:14px;border:1px solid var(--line);border-radius:var(--r-md);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;background:#fff;
  color:var(--ink);outline:none}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(91,108,255,.14)}
.btn{width:100%;height:52px;border:none;border-radius:var(--r-md);background:var(--brand);
  color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:#fff;border:1px solid rgba(239,68,68,.35);color:var(--danger)}
.btn:active{opacity:.85}
.pcard{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;
  margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;
  width:100%;font-family:inherit;text-align:left}
.pcard.sel{border-color:var(--brand);border-width:2px;padding:13px}
.rng{width:100%;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;
  background:var(--line);outline:none;margin:14px 0 6px}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--brand);cursor:pointer;box-shadow:0 2px 6px rgba(91,108,255,.4)}
.rng::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--brand);
  border:none;cursor:pointer}

.banner{padding:15px;border-radius:var(--r-lg);display:flex;gap:11px;align-items:flex-start}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 24px);
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:var(--r-pill);
  font-size:13.5px;z-index:9999;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

@media(max-width:1180px){#desk .notes{display:none}}
@media(max-width:900px){#desk .nav{display:none}}
</style>
</head>
<body>

<div id="desk">
  <div class="hero">
    <h1>Talk <b>Buddy</b> — Ön İzleme</h1>
    <p>Beta 0.9.0 · Flutter uygulamasının birebir ekran ön izlemesi.
       Telefondan açarsanız tam ekran uygulama gibi çalışır.</p>
    <div class="chips">
      <span class="chip">Flutter · Android</span>
      <span class="chip">Alt navigasyon</span>
      <span class="chip">Ayarlar sekmesi</span>
      <span class="chip">Gemini / Claude / OpenAI</span>
      <span class="chip">Cihaz üstü ses tanıma</span>
    </div>
  </div>

  <div class="stage">
    <div class="nav" id="navlist"></div>
    <div>
      <div class="device" id="phone-host-desk"></div>
      <p class="caption" id="caption"></p>
    </div>
    <div class="notes" id="notes"></div>
  </div>
</div>

<div id="phone-host">
  <div id="app">
    <div id="view"></div>
    <div id="nav"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

  {id:'c4', n:'Zeynep', a:'2 yaş 11 ay', av:'🐥', sc:.46, streak:1,  ph:['r','l','ş']},

const ALERTS = [

function trend(n, seed) {
  let s = seed || 7;
  const rnd = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  const out = [];
  for (let i = 0; i < n; i++) {
    out.push(Math.max(.05, Math.min(.98, .44 + .0055 * i + (rnd() - .5) * .085)));
  }
  return out;
}

const scoreHex = v => v >= .75 ? '#22C55E' : v >= .5 ? '#FFC53D' : v >= .3 ? '#F59E0B' : '#EF4444';

function area(data, w, h, color) {
  w = w || 320; h = h || 150; color = color || '#5B6CFF';
  const pad = 4, iw = w - pad * 2, ih = h - pad * 2;
  const pts = data.map((v, i) => [pad + i * iw / (data.length - 1), pad + ih - v * ih]);
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
    d += ` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`;
  }
  const g = 'g' + Math.random().toString(36).slice(2, 8);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block">
    <defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".3"/>
      <stop offset="100%" stop-color="${color}" stop-opacity=".02"/></linearGradient></defs>
    ${[0,.25,.5,.75,1].map(t => `<line x1="${pad}" y1="${pad+t*ih}" x2="${w-pad}" y2="${pad+t*ih}" stroke="#E6E8F0"/>`).join('')}
    <path d="${d} L${pts[pts.length-1][0]},${h-pad} L${pts[0][0]},${h-pad} Z" fill="url(#${g})"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linecap="round"/></svg>`;
}

function bars(data, w, h, threshold) {
  w = w || 320; h = h || 120; threshold = threshold || 5;
  const pad = 4, iw = w - pad * 2, ih = h - pad * 2, max = Math.max.apply(null, data.concat([1]));
  const gap = iw / data.length, bw = gap * .6;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block">
    ${data.map((v, i) => {
      const bh = Math.max(3, v / max * ih);
      return `<rect x="${pad+i*gap+(gap-bw)/2}" y="${pad+ih-bh}" width="${bw}" height="${bh}" rx="3"
        fill="${v >= threshold ? '#5B6CFF' : '#E6E8F0'}"/>`;
    }).join('')}</svg>`;
}

function spark(data, w, h, color) {
  const pts = data.map((v, i) => `${i*w/(data.length-1)},${h-v*h}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="0,${h} ${pts} ${w},${h}" fill="${color}" opacity=".12" stroke="none"/></svg>`;
}

function ring(v, size) {
  const st = size * .11, r = (size - st) / 2, c = 2 * Math.PI * r, col = scoreHex(v);
  return `<svg width="${size}" height="${size}" style="flex-shrink:0">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#E6E8F0" stroke-width="${st}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${st}"
      stroke-linecap="round" stroke-dasharray="${c*v} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="50%" text-anchor="middle" dy=".35em" font-size="${size*.26}" font-weight="800"
      fill="${col}" font-family="system-ui,sans-serif">%${Math.round(v*100)}</text></svg>`;
}

function radar(vals, labels, size) {
  const cx = size / 2, cy = size / 2, R = size * .3, n = vals.length;
  const pt = (v, i) => {
    const a = -Math.PI/2 + i*2*Math.PI/n;
    return [cx + Math.cos(a)*R*v, cy + Math.sin(a)*R*v];
  };
  const poly = arr => arr.map((v, i) => pt(v, i).join(',')).join(' ');
  return `<svg viewBox="0 0 ${size} ${size}" style="width:100%;height:${size}px">
    ${[.25,.5,.75,1].map(g => `<polygon points="${poly(new Array(n).fill(g))}" fill="none" stroke="#E6E8F0"/>`).join('')}
    ${vals.map((_, i) => { const p = pt(1, i); return `<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#E6E8F0"/>`; }).join('')}
    <polygon points="${poly(new Array(n).fill(.72))}" fill="#E6E8F0" fill-opacity=".55" stroke="#CFD4E4"/>
    <polygon points="${poly(vals)}" fill="#5B6CFF" fill-opacity=".22" stroke="#5B6CFF" stroke-width="2.2"/>
    ${vals.map((v, i) => { const p = pt(v, i); return `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#5B6CFF"/>`; }).join('')}
    ${labels.map((l, i) => { const p = pt(1.28, i); return `<text x="${p[0]}" y="${p[1]}" text-anchor="middle" dy=".35em"
      font-size="9.5" font-weight="700" fill="#5A6079" font-family="system-ui,sans-serif">${l}</text>`; }).join('')}</svg>`;
}

function skill(label, hint, v) {

      <div><div style="font-size:13.5px;font-weight:700">${label}</div>

    <div class="bar"><i style="width:${v*100}%;background:${scoreHex(v)}"></i></div></div>`;
}

/* ---------- Ayar bileşenleri ---------- */
function stile(icon, color, title, sub, action, dot, titleColor) {
  return `<button class="stile" ${action ? `onclick="${action}"` : 'style="cursor:default"'}>
    <span class="sicon" style="background:${color}1F;color:${color}">${icon}</span>
    <span class="grow"><span class="stitle" ${titleColor?`style="color:${titleColor}"`:''}>${title}</span>
      ${sub ? `<span class="ssub" style="display:block">${sub}</span>` : ''}</span>
    ${dot ? '<span style="width:9px;height:9px;border-radius:50%;background:var(--danger);flex-shrink:0"></span>' : ''}
    ${action ? '<span style="color:var(--ink-soft)">›</span>' : ''}</button>`;
}

function swtile(icon, color, title, sub, val, field) {
  return `<div class="stile" style="cursor:default">
    <span class="sicon" style="background:${color}1F;color:${color}">${icon}</span>
    <span class="grow"><span class="stitle">${title}</span>
      <span class="ssub" style="display:block">${sub}</span></span>
    <button class="sw ${val?'on':''}" onclick="toggleField('${field}')"></button></div>`;
}

function slider(label, valueLabel, value, min, max, step, field) {
  return `<div>
    <div class="row between">
      <span style="font-size:14px;font-weight:700">${label}</span>
      <span style="font-size:13px;font-weight:800;color:var(--brand)">${valueLabel}</span></div>
    <input class="rng" type="range" min="${min}" max="${max}" step="${step}" value="${value}"
      oninput="setNum('${field}',this.value)"></div>`;
}

const maskKey = k => k.length <= 10 ? '•'.repeat(k.length)
  : k.slice(0, 6) + '••••••••••••' + k.slice(-4);
const rateLabel = v => v <= .33 ? 'Çok yavaş' : v <= .42 ? 'Yavaş' : v <= .52 ? 'Normal'
  : v <= .63 ? 'Hızlı' : 'Çok hızlı';
const pitchLabel = v => v <= .95 ? 'Kalın' : v <= 1.15 ? 'Doğal' : v <= 1.35 ? 'Neşeli' : 'Çok ince';

/* =====================================================================
   Navigasyon
   ===================================================================== */
const SHELLS = {
  child: {screens:['child','activities','rewards'],
    tabs:[['🏠','Ana Sayfa'],['🎮','Oyunlar'],['⭐','Rozetler']], bg:'#F2F4FF'},
  parent: {screens:['parent','history','settings'],
    tabs:[['📊','Panel'],['📄','Seanslar'],['⚙️','Ayarlar']], bg:'var(--canvas)'},
  spec: {screens:['spec','alerts','settings'],
    tabs:[['👥','Danışanlar'],['🔔','Uyarılar'],['⚙️','Ayarlar']], bg:'var(--canvas)', badge:[1,3]},
};

let currentShell = null;
const history = [];

function shellOf(screen) {
  for (const k in SHELLS) if (SHELLS[k].screens.indexOf(screen) === 0) return k;
  return null;
}

function go(screen, noPush) {
  if (!SCREENS[screen]) return;
  if (!noPush && S.screen !== screen) history.push({s: S.screen, t: S.tab, sh: currentShell});

  const shell = shellOf(screen);
  if (shell) { currentShell = shell; S.tab = 0; }
  else if (!currentShell || SHELLS[currentShell].screens.indexOf(screen) < 0) {
    if (['session','result','role','aiset','speechset','childset','detail'].indexOf(screen) >= 0) {
      S.tab = -1;
    }
  } else {
    S.tab = SHELLS[currentShell].screens.indexOf(screen);
  }
  if (screen === 'role') currentShell = null;

  S.screen = screen;
  render();
}

function back() {
  const h = history.pop();
  if (h) { currentShell = h.sh; S.tab = h.t; S.screen = h.s; render(); }
  else go('role', true);
}

function tabTo(i) {
  if (!currentShell) return;
  S.tab = i;
  S.screen = SHELLS[currentShell].screens[i];
  render();
}

function setRange(v) { S.range = v; render(); }
function setDetailTab(i) { S.detailTab = i; render(); }
function toggleKey() { S.showKey = !S.showKey; render(); }

function setField(f, v) { S.settings[f] = v; persist(); softRefresh(f); }
function setNum(f, v) { S.settings[f] = parseFloat(v); persist(); render(true); }
function toggleField(f) { S.settings[f] = !S.settings[f]; persist(); render(); }
function setProvider(id) { S.settings.provider = id; persist(); render(); }

let softTimer = null;
function softRefresh(field) {
  if (['apiKey','proxyUrl'].indexOf(field) >= 0) return;
  clearTimeout(softTimer);
  softTimer = setTimeout(() => render(true), 400);
}

function clearKey() {
  S.settings.apiKey = '';
  S.settings.provider = 'offline';
  persist(); render(); toast('Anahtar silindi');
}

function resetAll() {
  if (!confirm('Kayıtlı API anahtarı, profil ve tüm ayarlar silinecek. Devam edilsin mi?')) return;
  S.settings = {provider:'offline', apiKey:'', useProxy:false, proxyUrl:'', rate:.44, pitch:1.18,
    limit:12, silence:6, redact:true, store:true, childName:'Elif', childAge:52, childAvatar:'🐰'};
  persist(); render(); toast('Tüm veriler sıfırlandı');
}

function testConn() {
  const s = S.settings, out = document.getElementById('testout');
  const btn = document.getElementById('testbtn');
  btn.textContent = '⏳ Deneniyor...'; btn.disabled = true;
  setTimeout(() => {
    const ok = s.useProxy ? !!s.proxyUrl.trim() : s.apiKey.trim().length > 12;
    const msg = ok ? 'Bağlantı başarılı.'
      : (s.useProxy ? 'Sunucu adresi girilmemiş.' : 'API anahtarı geçersiz veya eksik.');
    const c = ok ? '#22C55E' : '#EF4444';
    out.innerHTML = `<div style="margin-top:14px;background:${c}14;border:1px solid ${c}4D;
      border-radius:var(--r-md);padding:14px;display:flex;gap:10px">
      <span style="color:${c}">${ok?'✓':'⛔'}</span>
      <div><div style="font-size:14px;font-weight:800;color:${c}">${ok?'Başarılı':'Başarısız'}</div>
        <p style="font-size:12.5px;line-height:1.45;margin-top:3px">${msg}</p>
        ${ok?'<p class="sub" style="font-size:11.5px;margin-top:4px">Yanıt süresi: 412 ms</p>':''}
      </div></div>`;
    btn.textContent = '📡 Bağlantıyı test et'; btn.disabled = false;
  }, 900);
}

function speakPreview() {
  const text = 'Merhaba! Ben Buddy. Sesim böyle çıkıyor, beğendin mi?';
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'tr-TR';
    u.rate = S.settings.rate * 2.1;
    u.pitch = S.settings.pitch;
    speechSynthesis.speak(u);
    toast('Buddy konuşuyor...');
  } else {
    toast('Bu tarayıcı sesi desteklemiyor');
  }
}

function checkMic() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast('Bu tarayıcıda mikrofon yok'); return;
  }
  navigator.mediaDevices.getUserMedia({audio: true})
    .then(st => { st.getTracks().forEach(t => t.stop()); toast('✓ Mikrofon hazır'); })
    .catch(() => toast('⛔ Mikrofon izni verilmedi'));
}

function copyUrl(u) {
  if (navigator.clipboard) navigator.clipboard.writeText(u).then(() => toast('Adres kopyalandı'));
  else toast(u);
}

function gate() {
  const a = 6 + Math.floor(Math.random() * 7), b = 6 + Math.floor(Math.random() * 7);
  const ans = prompt('Ebeveyn Girişi\n\nDevam etmek için soruyu yanıtlayın:\n' + a + ' × ' + b + ' = ?');
  if (ans === null) return;
  if (parseInt(ans, 10) === a * b) go('parent');
  else toast('Yanlış, tekrar deneyin');
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1900);
}

         ['Proxy seçeneği','Yayına çıkarken anahtarı cihazdan çıkarıp kendi sunucunuza taşır.']],
  speechset:[['Canlı ön izleme','"Sesi dinle" tarayıcının konuşma sentezini kullanır; ayarladığınız hız ve ton uygulanır.'],
             ['Mikrofon testi','Gerçek mikrofon izni ister, uygulamadaki akışın aynısı.']],
  childset:[['Yaş normu','Yaş, konuşma hızı ve cümle uzunluğu ölçümlerinin hangi norma göre değerlendirileceğini belirler.']],
  spec:[['Liste değil sıra','Panel "kime bakayım?" sorusunu risk skoruna göre cevaplar.'],
        ['Rozet','Alt navigasyonda bekleyen uyarı sayısı gösterilir.']],
  detail:[['Fonolojik harita','20 Türkçe ünsüz renk kodlu; tek bakışta sorunlu ses görünür.'],
          ['İşaretli turlar','Düşük güvenli konuşma turları dökümde sarı çerçeveli.']],
};

function render(keepScroll) {
  const view = document.getElementById('view');
  const nav = document.getElementById('nav');
  const scroll = keepScroll ? view.scrollTop : 0;

  const activeEl = document.activeElement;
  const activeId = activeEl && activeEl.id;
  const caret = activeEl && activeEl.selectionStart;

  view.innerHTML = SCREENS[S.screen]();

  const shell = currentShell;
  const fullscreen = ['session','result','role','aiset','speechset','childset','detail'].indexOf(S.screen) >= 0;

  if (shell && !fullscreen) {
    const sh = SHELLS[shell];
    document.getElementById('app').style.background = sh.bg;
    nav.className = '';
    nav.innerHTML = sh.tabs.map((t, i) => {
      const badge = sh.badge && sh.badge[0] === i ? `<span class="dot">${sh.badge[1]}</span>` : '';
      return `<button class="${i===S.tab?'on':''}" onclick="tabTo(${i})">
        <span class="ni">${t[0]}</span><span class="nl">${t[1]}</span>${badge}</button>`;
    }).join('');
  } else {
    nav.className = 'hide';
    nav.innerHTML = '';
    document.getElementById('app').style.background =
      S.screen === 'child' || S.screen === 'result' || S.screen === 'rewards'
        ? '#F2F4FF' : 'var(--canvas)';
  }

  view.scrollTop = scroll;

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) { el.focus(); try { el.setSelectionRange(caret, caret); } catch (e) {} }
  }

  const cap = document.getElementById('caption');
  if (cap) cap.textContent = CAPTIONS[S.screen] || '';
  const notes = document.getElementById('notes');
  if (notes) {
    notes.innerHTML = (NOTES[S.screen] || [])
      .map(n => `<div class="note"><h4>${n[0]}</h4><p>${n[1]}</p></div>`).join('');
  }
  document.querySelectorAll('#navlist button').forEach(b =>
    b.classList.toggle('on', b.dataset.s === S.screen));
}

/* Masaüstü menüsü */
const MENU = [
  ['Giriş', [['role','🚪','Rol Seçimi']]],
  ['Çocuk', [['child','🧸','Ana Ekran'],['activities','🎮','Oyunlar'],
             ['session','🎤','Konuşma Seansı'],['result','🎉','Seans Sonucu'],
             ['rewards','⭐','Rozetler']]],
  ['Ebeveyn', [['parent','📊','Gösterge Paneli'],['history','📄','Seans Geçmişi']]],
  ['Ayarlar', [['settings','⚙️','Genel'],['aiset','🔑','Yapay Zeka'],
               ['speechset','🎚️','Ses ve Seans'],['childset','🙂','Çocuk Profili']]],
  ['Uzman', [['spec','👥','Danışanlar'],['alerts','🔔','Uyarılar'],['detail','🔬','Danışan Detayı']]],
];

function buildMenu() {
  const el = document.getElementById('navlist');
  el.innerHTML = MENU.map(g =>
    `<p class="nav-title">${g[0]}</p>` +
    g[1].map(i => `<button data-s="${i[0]}"><span class="ico">${i[1]}</span>${i[2]}</button>`).join('')
  ).join('');
  el.querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => go(b.dataset.s)));
}

/* =====================================================================
   Başlangıç — mobil algılama
   ===================================================================== */
function isMobile() {
  const touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  const narrow = Math.min(window.innerWidth, window.innerHeight) < 560;
  const ua = /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(navigator.userAgent);
  return (touch && narrow) || (ua && narrow) || window.innerWidth < 560;
}

function applyLayout() {
  const mobile = isMobile();
  document.body.classList.toggle('mobile', mobile);
  const host = document.getElementById('phone-host');
  const deskSlot = document.getElementById('phone-host-desk');

  if (mobile) {
    if (host.parentNode !== document.body) document.body.appendChild(host);
    host.className = '';
  } else {
    if (host.parentNode !== deskSlot) deskSlot.appendChild(host);
    host.className = '';
    host.style.cssText = 'width:100%;height:100%';
  }
}

/* Mobilde geri tuşu */
window.addEventListener('popstate', () => {
  if (history.length) { back(); location.hash = '#' + S.screen; }
});

/* Yeniden boyutlandırma */
let rzTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(() => { applyLayout(); render(true); }, 150);
});

/* iOS'ta çift dokunma yakınlaştırmasını kapat */
let lastTouch = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouch < 320) e.preventDefault();
  lastTouch = now;
}, {passive: false});

buildMenu();
applyLayout();
go('role', true);
</script>
